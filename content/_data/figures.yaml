figure_list:

  - id: "fig-001"
    src: "figures/fig-001.jpg"
    zoom: true
    alt: "Title page of an almanac that features information in French about the publication, including title, year, contents, and name of the publisher. The page is illustrated with a coat of arms topped by a crown and embraced by two angel figures, one on each side of the crest."
    label: "Fig. 1"
    caption: "*Almanach royal*, 1763, title page."
    credit: "Paris, Bibliothèque Nationale de France. (Image source: Gallica, BnF.)"

  - id: "fig-002"
    src: "figures/fig-002.jpg"
    zoom: true
    alt: "Painting featuring a port scene at night. To the left, groups of people are shown loading boats under the moonlight while, on the right, individuals gather around a fire."
    label: "Fig. 2"
    caption: "Claude-Joseph Vernet (French, 1714–89), *Night*, from the series *Four Times of the Day*, 1762. Oil on canvas, 83.5 × 135 cm."
    credit: "Châteaux de Versailles et de Trianon, MV5927. (© RMN-Grand Palais / photo: Christophe Fouin / Art Resource, NY.)"

  - id: "fig-003"
    src: "figures/fig-003.jpg"
    zoom: true
    alt: "Painting of the Normandy port at dawn. People are shown on the dock offloading fish from sailboats and stowing the fishing nets."
    label: "Fig. 3"
    caption: "Claude-Joseph Vernet (French, 1714–89), *Port of Dieppe*, 1765. Oil on canvas, 165.5 × 264 cm."
    credit: "Paris, Musée de la Marine, 5OA13. (© RMN-Grand Palais / Art Resource, NY.)"

  - id: "fig-004"
    src: "figures/fig-004.jpg"
    zoom: true
    alt: "Armchair which structure is made of wood, its back consists of a single cane layer, and its upholstered seat is covered with leather."
    label: "Fig. 4"
    caption: "Unknown maker, *Fauteuil*, last quarter of the eighteenth century. Wood, cane, and leather, 89 × 59 cm."
    credit: "Paris, Musée du Louvre, OA 7879, on loan to Grasse, Villa-Musée Fragonard. (© 2022 Musée du Louvre / Objets d'art du Moyen Age, de la Renaissance et des temps modernes.)"

  - id: "fig-005"
    src: "figures/fig-005.jpg"
    zoom: true
    alt: "Cushioned and wheeled armchair featuring a wooden tilting stand on the right and a desk on the left. Both the stand and the desk exhibit a lacquered design showcasing botanical motifs."
    label: "Fig. 5"
    caption: "Charles-François Normand, Voltaire’s *fauteuil*, ca. 1775. Gilded beech, velvet, lacquer, and iron, 91 × 66 × 55 cm."
    credit: "Paris, Musée Carnavalet."

  - id: "fig-006"
    src: "figures/fig-006.jpg"
    zoom: true
    alt: "Engraving illustrating technical drawings of an armchair. The text on the page reads in French quote plans and elevations of a desk chair end quote."
    label: "Fig. 6"
    caption: "André-Jacob Roubo (French, 1739–91), Design of a *fauteuil de cabinet*, 1772, from André-Jacob Roubo, *L’art du menuisier en meubles* (Paris, 1772), no. 233."
    credit: "Paris, Bibiliothèque Nationale de France. (Image source: Gallica.)"

  - id: "fig-007"
    src: "figures/fig-007.jpg"
    zoom: true
    alt: "Cream-colored paper featuring typed and handwritten text in black regarding a baptism held at Saint-Sulpice Parish Church in Paris."
    label: "Fig. 7"
    caption: "Baptism certificate of Hubert Robert (baptism 1733, certificate issued 1760)."
    credit: "Paris, Archives Nationales, MC/ET/LXXXIII/490."

  - id: "fig-008"
    src: "figures/fig-008.jpg"
    zoom: true
    alt: "Cream-colored folio with handwritten text in black. The body of the text is aligned to the right of the page, and a last name is included to the left for each of the three entries."
    label: "Fig. 8"
    caption: "*Registre des baptêmes*, parish of Saint-Roch, 1790, page 78."
    credit: "Archives de Paris, V.6E 1."

  - id: "fig-009"
    src: "figures/fig-009.jpg"
    zoom: true
    alt: "Typed folio with handwritten notes in black and red in the margins, a signature at the bottom, and a stamp on the title."
    label: "Fig. 9"
    caption: "Nicolas Robert’s contract for a “Tontine créée par Édit du mois de Décembre 1759,” signed 10 March 1761."
    credit: "Paris, Archives Nationales, MC/ET/LXXXIII/490."

  - id: "fig-010"
    src: "figures/fig-010.jpg"
    zoom: true
    alt: "Painting of a woman standing on clouds and descending upon a winged man who reclines on cushioned surfaces. The figures appear to be leaning out of the frame."
    label: "Fig. 10"
    caption: "Charles-Antoine Coypel (French, 1694–1752), *Painting Awakening Genius*, ca. 1723. Oil on canvas, 190 × 135 cm."
    credit: "Private collection. Image source: Christie’s/Bridgeman Images. (Photo © Christie's Images/Bridgeman Images.)"

  - id: "fig-011"
    src: "figures/fig-011.jpg"
    alt: "Preparatory line drawing of the painting shown in Figure 10. The painter’s canopy bed is depicted in front and below the painting and following the same orientation, parallel to the wall."
    label: "Fig. 11"
    caption: "Charles-Antoine Coypel (French, 1694–1752), Preparatory drawing for *Painting Awakening Genius*, ca. 1723. Black chalk."
    credit: "Location unknown. (Image source: Christie’s catalogue.)"

  - id: "fig-012"
    src: "figures/fig-012.jpg"
    zoom: true
    alt: "Tapestry featuring in the center two men standing in a palatial room and two women who appear above them in a sea of clouds. The scene is enclosed in a golden frame and surrounded by abundant flower garlands set before a damask-covered pink wall."
    label: "Fig. 12"
    caption: "After Charles-Antoine Coypel (French, 1694–1752), *Don Quixote Dreams*, from the series *HIstory of Don Quixote*, ca. 1727. Gobelins high-warp tapestry, silk and wool, 370.8 × 386.1 cm."
    credit: "Los Angeles, The J. Paul Getty Museum."

  - id: "fig-013"
    src: "figures/fig-013.jpg"
    zoom: true
    alt: "Typed page of a dictionary showing definitions for the term landscape and related words. Trees drawn in pencil have been added over the text."
    label: "Fig. 13"
    caption: "Antoine-Joseph Pernéty, *Dictionnaire portatif de peinture, sculpture et gravure* (1757), annotated by Gabriel de Saint-Aubin (French, 1724–80), ca. 1757–67. Graphite."
    credit: "Paris, Petit Palais. (CCØ Paris Musées / Petit Palais, Musée des Beaux-Arts de la Ville de Paris.)"

  - id: "fig-014"
    src: "figures/fig-014.jpg"
    zoom: true
    alt: "Frontispiece featuring a man wearing a winged cap who reclines on a headstone with inscriptions that refer to the title of the volume. Three cherubs are shown to the right of the man, standing on top of the stone, painting and playing a musical instrument. The scene is set in an ancient Roman architectural environment."
    label: "Fig. 14"
    caption: "Gilles-Marie Oppenord (French, 1672–1742), Alternative title page or frontispiece for Cesare Ripa and Jean Baudouin, *Iconologie; ou, Explication nouvelle de plusieurs emblemes* (Paris, 1636). Pen and brown ink, brush in brown and gray ink over a pencil sketch, 32.5 × 21.5 cm."
    credit: "Montreal, Canadian Centre for Architecture."

  - id: "fig-015"
    src: "figures/fig-015.jpg"
    zoom: true
    alt: "Ink illustration of a funerary monument consisting of a sarcophagus and a rounded plaque showcasing a neoclassical-style scene on the wall behind it, and, underneath, a grotesque mask."
    label: "Fig. 15"
    caption: "Gilles-Marie Oppenord (French, 1672–1742), Design for a funeral monument for the 1636 French edition of Cesare Ripa and Jean Baudouin, *Iconologie; ou, Explication nouvelle de plusieurs emblemes* (Paris, 1636). Pen and brown ink with brown and gray wash, 32.6 × 21.3 cm."
    credit: "Montreal, Canadian Centre for Architecture."

  - id: "fig-016"
    src: "figures/fig-016.jpg"
    zoom: true
    alt: "Open book showing marbled endpapers. The page on the left features an ink drawing of a person rowing."
    label: "Fig. 16"
    caption: "Antoine-Joseph Pernéty, *Dictionnaire portatif de peinture, sculpture et gravure* (1757), annotated by Gabriel de Saint-Aubin (French, 1724–80), ca. 1757–67. Pen and black ink on endpaper."
    credit: "Paris, Petit Palais. (CCØ Paris Musées / Petit Palais, Musée des Beaux-Arts de la Ville de Paris.)"

  - id: "fig-017"
    src: "figures/fig-017.jpg"
    zoom: true
    alt: "Line drawing of a portal framing an ornamental fountain from which human figures hang. There is an animal lying down at the base. Around the fountain, there are medallions featuring human representations of doubt, discretion, divinity, pain, economy and equality."
    label: "Fig. 17"
    caption: "Gilles-Marie Oppenord (French, 1672–1742), Design for a portal with ornamentation drawn on a printed folio, with medalions of Doute, Discretion, Divinité, Douleur, Economie, and Égalité, for Cesare Ripa and Jean Baudouin, *Iconologie, ou Explication nouvelle de plusieurs emblemes* (Paris, 1636). Pen and brown ink over engraving, 32.8 × 22.3 cm."
    credit: "Montreal, Canadian Centre for Architecture."

  - id: "fig-018"
    src: "figures/fig-018.jpg"
    zoom: true
    alt: "Plate that illustrates how to use a burin to make engravings. The top register of the plate shows the burin on its own. The middle section features two disembodied hands showing how to hold the burin using the thumb and index finger to guide the tool’s blade. The bottom register showcases how the burin should be put to the plate to trace a line."
    label: "Fig. 18"
    caption: "Charles-Nicolas Cochin (French, 1715–90), *De la manière de graver à l’eau-forte et au burin*, 1745. Etching and engraving."
    credit: "Paris, Bibliothèque Nationale de France. (Image source: Gallica, BnF.)"

  - id: "fig-019"
    src: "figures/fig-019.jpg"
    zoom: true
    alt: "Engraving that illustrates the sense of sight. A man is shown embracing a woman for whom he holds a mirror up so that she can see her reflection. Under the scene, a title reads in French quote la vue end quote."
    label: "Fig. 19"
    caption: "Renée-Elisabeth Marlié (French, 1714–73), after Jan Saenredam (Dutch, 1565–1607), after Henrick Goltzius (Dutch, 1558–1617), *Sight* from *The Five Senses*, ca. 1741. Engraving, 22 × 15.2 cm."
    credit: "London, British Museum. (© The Trustees of the British Museum / Art Resource, NY.)"

  - id: "fig-020"
    src: "figures/fig-020.jpg"
    zoom: true
    alt: "Engraving that illustrates a lavishly attired woman sitting in front of a table, on top of which lies a book open. A similarly richly dressed man stands before her, leaning toward the book with a quill in his left hand. A group of five individuals surround them. One of them is shown presenting a small chest filled with jewelry. Under the scene, a title reads in French quote contrat de mariage end quote."
    label: "Fig. 20"
    caption: "Renée-Elisabeth Marlié (French, 1714–73), after Carle Van Loo (French, 1705–65), *The Marriage Contract*, 1756. Engraving."
    credit: "Paris, Bibliothèque National de France."

  - id: "fig-021"
    src: "figures/fig-021.jpg"
    zoom: true
    alt: "Plate identifying the various elements of a camera obscura. Figure six on the upper left corner showcases the overall process by which images get projected onto a two-dimensional surface using a mirror and a lens. Figure seven on the upper right corner illustrates the placement of the lens and mirror device at the top of the camera obscura structure inside a box. Figure eight on the bottom right corner shows how the structure is covered with drapery to create a darkened space. Figure nine on the bottom left corner highlights the lens and mirror device."
    label: "Fig. 21"
    caption: "Camera obscura, “Dessein” from *Recueil de planches sur les sciences, les arts libéraux et les arts mécaniques* (1765), plate V."
    credit: "(Paris, Bibliothèque Nationale de France.)"

  - id: "fig-022"
    src: "figures/fig-022.jpg"
    zoom: true
    alt: "Preparatory drawing featuring in red chalk the architectural setting in which the scene takes place and in black chalk the human and animal figures that fill the space."
    label: "Fig. 22"
    caption: "Charles Parrocel (French, 1688–1752), *Reception of the Turkish Ambassadors at the Tuileries*, ca. 1727. Red and black chalk."
    credit: "Paris, Bibliothèque Nationale de France."

  - id: "fig-023"
    src: "figures/fig-023.jpg"
    alt: "Ink drawing of a person on a horse brandishing a weapon above those who surround him."
    label: "Fig. 23"
    caption: "Charles Parrocel (French, 1688–1752), *Cavalry Engagement*, ca. 1745. Pen and brown ink with brown and gray wash, 35.7 × 18.2 cm."
    credit: "Stockholm, Nationalmuseum, NMH 2892/1863. (Photo: Nationalmuseum.)"

  - id: "fig-024"
    src: "figures/fig-024.jpg"
    alt: "Engraving illustrating a portable magnifier under which a small, ornamental dragon is observed. The various components of the magnifier are labeled with capital letters. The scene is topped by a title that reads quote dessein d’un porte loupe end quote."
    label: "Fig. 24"
    caption: "Louis Joblot (French, 1645–1723), *Dessin d’une porte loupe*, 1718."
    credit: "Paris, Bibliothèque Nationale de France."

  - id: "fig-025"
    src: "figures/fig-025.jpg"
    zoom: true
    alt: "Map featuring two possible routes from Paris to Lyon. An insert on the right upper corner indicates the itinerary for the fastest route of the two options presented. Information about the title and author of the map is included in a cartouche on the bottom left corner, framed by forestry motifs."
    label: "Fig. 25"
    caption: "Claude Sidone Michel and Louis-Charles Denos, “Route from Paris to Lyon,” from *L’indicateur fidèle, ou guide des voyageurs* (Paris, 1767)."
    credit: "Paris, Bibliothèque Nationale de France."

  - id: "fig-026"
    src: "figures/fig-026.jpg"
    zoom: true
    alt: "Rectangular stone monolith featuring three fleur-de-lis motifs in low relief on its upper half."
    label: "Fig. 26"
    caption: "French milestone with fleur-de-lis, eighteenth century."
    credit: "(Photo: Jpcuvelier, CC BY SA 4.0.)"


  - id: "fig-027"
    src: "figures/fig-027.jpg"
    zoom: true
    alt: "Fan featuring two concentric paper leaves and carved ivory guards. The fan leaves, gorge, and guard sticks are all decorated with countryside scenes including cabriolets."
    label: "Fig. 27"
    caption: "Cabriolet fan, ca. 1755. Paper leaves, carved ivory guards, backed with mother-of-pearl, 28.5 cm (guardstick)."
    credit: "London, Royal Collection, RCIN 25380. (Royal Collection Trust / © Her Majesty Queen Elizabeth II 2021.)"

  - id: "fig-028"
    src: "figures/fig-028.jpg"
    zoom: true
    alt: "Shallow wooden box divided into nine compartments holding miniature glass bottles that contain ground pigments as well as fine brushes and other tools."
    label: "Fig. 28"
    caption: "Color box, eighteenth century. Wood, metal, glass, and various pigments, 10 × 46 × 37 cm."
    credit: "Grasse, Villa-Musée Fragonard. (Courtesy of Villa-Musée Fragonard, Grasse.)"

  - id: "fig-029"
    src: "figures/fig-029.jpg"
    zoom: true
    alt: "Plate titled quote Peinture: Atelier, Palettes et Pinceaux end quote, or Painting: Workshop, Palettes, and Brushes in French. A scene showing the inside a studio appears at the top. Six painters are depicted at work on canvases of different sizes: one of them is shown on top of a ladder to reach the full extent of their canvas, and another is featured painting the portrait of a person who sits on a chair in front of them. A series of brushes, painting and palette knives, and color palettes are shown below, organized in rows."
    label: "Fig. 29"
    caption: "“Painting” from *Recueil de planches sur les sciences, les arts libéraux et les arts mécaniques* (1765), plate I."
    credit: "(Image courtesy of the ARTFL Encyclopédie Project, University of Chicago.)"

  - id: "fig-030"
    src: "figures/fig-030.jpg"
    zoom: true
    alt: "Trade card depicting a shop counter in front of an apothecary cabinet with labeled drawers. An elaborate ornamental mortar with the name of the store written on its pedestal is shown sitting on top the counter. A garland of palettes and brushes hangs above it. Underneath, a text presented on a drapery discusses the work of the shop owner, Louis Picard."
    label: "Fig. 30"
    caption: "Pierre Landry (French, 1630–1701), *Trade Card of Louis Picard, Marchand Épicier, Au Mortier d’Or*, ca. 1695. Etching and engraving, 24 × 20 cm."
    credit: "Waddesdon Manor. (Waddesdon Image Library.)"

  - id: "fig-031"
    src: "figures/fig-031.jpg"
    zoom: true
    alt: "Portrait of an older man shown sideways, with his face oriented towards the viewer. The brushstrokes can be seen across the canvas."
    label: "Fig. 31"
    caption: "Jean-Honoré Fragonard (French, 1732–1806), *Head of an Old Man*, detail, ca. 1765. Oil on canvas, 54 × 45 cm. Amiens, Musée de Picardie, inv. M.P.Lav.1894-144. (Photo Marc Jeanneteau /Musée de Picardie.)"

  - id: "fig-032"
    src: "figures/fig-032.jpg"
    zoom: true
    alt: "Portrait of a woman from below. Her head appears tilted upwards and looking away from the viewer. She wears pearls in her hair and uses a white sheet to cover her body partially. Color has been applied to the image with crayon-manner etching that results in apparent lines. The text below the image provides information regarding the author of the illustration and the materials used."
    label: "Fig. 32"
    caption: "Louis-Marin Bonnet (French, 1736–93), after Jean-Baptiste Huët (French, 1745–1811), *Head of a Woman*, after 1780. Crayon-manner etching, 47.4 × 36.5 cm."
    credit: "Paris, Institut National d’Histoire de l’Art."

  - id: "fig-033"
    src: "figures/fig-033.jpg"
    zoom: true
    alt: "Title page of a pamphlet advertising crayons. The illustration depicts an architectural frontispiece atop a pedestal framed by Corinthian-style columns. Text in French appears in between the frontispiece columns."
    label: "Fig. 33"
    caption: "André Nadaux, Frontispiece, 1780. Crayon-manner etching."
    credit: "Paris, Archives Nationales. (Waddesdon Image Library, University of Central England Digital Services.)"

  - id: "fig-034"
    src: "figures/fig-034.jpg"
    zoom: true
    alt: "Naturalistic drawing of a nude man standing. The weight of the man rests on his right leg, while the left one stands slightly behind him. He looks up and to the left, and holds his hands above his head, covering his face partially with his left forearm."
    label: "Fig. 34"
    caption: "Jean-Germain Drouais (French, 1763–88), *Academy Study*, 1778–79. Black chalk on paper, 54.6 × 44.5 cm."
    credit: "Paris, École Nationale Supérieure des Beaux-Arts, EBA2883. (Art Resource / NY.)"

  - id: "fig-035"
    src: "figures/fig-035.jpg"
    zoom: true
    alt: "Illustration of a busy scene inside a life drawing class. Two individuals pose nude in the center of the room, standing atop a platform, and numerous students surround them in a semicircular arrangement. The walls of the room are covered with paintings, and several neoclassical nude sculptures stand in between the crowd."
    label: "Fig. 35"
    caption: "Charles Natoire (French, 1700–1777), *Life Drawing Class*, 1746. Pen, black and brown ink, gray wash, and watercolor, 45.3 × 32.2 cm."
    credit: "London, Courtauld Institute of Art. (The Courtauld, London [Samuel Courtauld Trust], photo © The Courtauld.)"

  - id: "fig-036"
    src: "figures/fig-036.jpg"
    zoom: true
    alt: "Portrait of a man shown sitting on a red velvet armchair. He wears a white shirt with ruffles down the front, a matching pink coat and waistcoat, cream-colored knee-length breeches, and white stockings. He holds a brush in his right hand and a color palette in his left."
    label: "Fig. 36"
    caption: "Joseph-Siffred Duplessis (French, 1725–1802), *Joseph-Marie Vien*, 1785. Oil on canvas, 133 × 100 cm."
    credit: "Paris, Musée du Louvre, INV4306. (© RMN-Grand Palais / photo: Michel Urtado. / Art Resource, NY.)"

  - id: "fig-037"
    src: "figures/fig-037.jpg"
    alt: "Badge consisting of a four-armed, double-pointed, ball tipped cross with white enameled rims. Fleurs-de-lis motifs in gold emerge from the angles of the cross arms. An oval medallion in the center features the figure of Saint Michael in a slaying act. The cross is suspended from a gold ring."
    label: "Fig. 37"
    caption: "Decoration of the Order of Saint Michel, eighteenth century. Gold and enamel."
    credit: "Paris, Musée de la Légion d’Honneur et des Ordres de Chevalerie, Gift of the marquis de Champreux, 1912, inv. 0160."

  - id: "fig-038"
    src: "figures/fig-038.jpg"
    zoom: true
    alt: "Painting of a room where a man's portrait is being painted. The painter sits behind a large canvas while looking towards her subject. Another woman sits beside the painter, holding a color palette with her left hand and a brush in her right. Six individuals stand behind them. One of them leans toward the canvas with his hand forward pointing to the painting.  The subject of the portrait sits on a red velvet armchair to the right of the image. Two people stand behind him, and four more appear beside him."
    label: "Fig. 38"
    caption: "Gabrielle Capet (French, 1761–1818), *Adélaïde Labille-Guiard Painting the Portrait of Joseph-Marie Vien*, 1808. Oil on canvas, 69 × 83.5 cm."
    credit: "Munich, Neue Pinakothek, Inv. FV 9. (bpk Bildagentur / Neue Pinakothek/Bayerische Staatsgemaeldesammlungen/Munich / Art Resource, NY.)"

  - id: "fig-039"
    src: "figures/fig-039.jpg"
    zoom: true
    alt: "Rectangular box bound in embossed leather featuring brass ornamentation on its corners and around the keyhole."
    label: "Fig. 39"
    caption: "The Académie’s document box, ca. 1655."
    credit: "Paris, École Nationale Supérieure des Beaux-Arts, MU 12579. Gilding, brass, Morocco leather. 19.8 × 54.3 × 43 cm. (© Beaux-Arts de Paris, Dist. RMN–Grand Palais / Art Resource, NY.)"

  - id: "fig-040"
    src: "figures/fig-040.jpg"
    zoom: true
    alt: "Box from figure 39 shown with the lid opened. Folded documents and two wax seals can be seen inside."
    label: "Fig. 40"
    caption: "The Académie’s document box (open), ca. 1655."
    credit: "Paris, École Nationale Supérieure des Beaux-Arts, MU 12579. Gilding, brass, Morocco leather. 19.8 × 54.3 × 43 cm. (© Beaux-Arts de Paris, Dist. RMN–Grand Palais / Art Resource, NY.)"

  - id: "fig-041"
    src: "figures/fig-041.jpg"
    zoom: true
    alt: "Portrait of a man on a red armchair. His left hand rests on a set of bound folios. A document box with metal ornamentation is to his right, shown under his lifted right arm."
    label: "Fig. 41"
    caption: "Jean Tiger, *Henri Testelin*, 1675. Oil on canvas. 116 × 89 cm."
    credit: "Châteaux de Versailles et de Trianon, MV3585. (© RMN-Grand Palais / photo: Gérard Blot / Art Resource, NY.)"

  - id: "fig-042"
    src: "figures/fig-042.jpg"
    zoom: true
    alt: "Portrait of a lavishly dressed woman holding a white, spaniel dog on her lap. The woman uses her hands to hold the animal close to her. She is shown wearing a lace hair ornament, a pearl necklace, a pink dress with ruffles at the chest and the sleeves, and a yellow coat."
    label: "Fig. 42"
    caption: "Joseph-Siffred Duplessis (French, 1725–1802), *Madame Fréret d’Héricourt and Her Dog*, 1769. Oil on canvas, 81.3 × 64.8 cm."
    credit: "Kansas City, The Nelson-Atkins Museum of Art, Purchase of William Rockhill Nelson Trust, 53-80. (Photo: Michael Lamy.)"

  - id: "fig-043"
    src: "figures/fig-043.jpg"
    zoom: true
    alt: "Portrait depicting a man, a woman, and two children. The man stands to the left of the painting holding a color palette with his left hand. The woman is shown to his left, wrapping the two young children with her arms. A small, grey dog is partly shown at the bottom right corner."
    label: "Fig. 43"
    caption: "Nicolas de Largillière (French, 1656–1746), *Portrait of the Artist and His Family*, ca. 1704. Oil on canvas, 128 × 167 cm."
    credit: "Kunsthalle Bremen. (© Kunsthalle Bremen–Lars Lohrisch–ARTOTHEK.)"

  - id: "fig-044"
    src: "figures/fig-044.jpg"
    zoom: true
    alt: "Portrait of a man and a girl shown standing, side by side. The pair hold hands front and center of the scene, while a dog is shown behind them to their left, coming up the stairs that lead to the exterior of the building."
    label: "Fig. 44"
    caption: "François Gérard (French, 1770–1837), *Jean-Baptiste Isabey and His Daughter, Alexandrine*, 1795. Oil on canvas, 195 × 130 cm."
    credit: "Paris, Musée du Louvre, INV4764. (© Musée du Louvre, Dist. RMN-Grand Palais / Angele Dequier / Art Resource, NY. Photo: Angele Dequier.)"

  - id: "fig-045"
    src: "figures/fig-045.jpg"
    zoom: true
    alt: "Painting set in a palatial terrace. A group of adults and children gather to the left of the image. Among them is a girl playing with a small dog, a seated woman playing a guitar, and a standing man. A Black boy is shown to the right of the scene by himself grabbing a bottle out of a metal tub. A standing man tuning a large lute and a large dog are represented in the center. The background is filled with a park landscape with strolling figures."
    label: "Fig. 45"
    caption: "Jean-Antoine Watteau (French, 1684–1721), *Les charmes de la vie*, ca. 1718–19. Oil on canvas, 67.3 × 92.5 cm."
    credit: "London, Wallace Collection. (By kind permission of the Trustees of the Wallace Collection, London / Art Resource, NY.)"

  - id: "fig-046"
    src: "figures/fig-046.jpg"
    zoom: true
    alt: "Preparatory drawing of a group of people at the bottom of the temple steps. The busyness of the scene, the drapery worn by the figures, and the numerous pencil traces makes it difficult to make out specific individuals and actions."
    label: "Fig. 46"
    caption: "Jean Restout (French, 1692–1768), *Dedication of the Temple of Solomon*, 1743. Black and white chalk on paper, 35.8 × 67.5 cm."
    credit: "Rouen, Musée des Beaux-Arts, inv. AG 1909.34.63. (© Agence Albatros /Réunion des Musées Métropolitains Rouen Normandie, Rouen, Musée des Beaux-Arts.)"

